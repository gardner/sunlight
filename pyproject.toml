[project]
name = "sunlight-requests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "dnspython>=2.8.0",
    "docling>=2.93.0",
    "huggingface-hub>=1.14.0",
    "instructor>=1.15.1",
    "lancedb>=0.30.2",
    "llama-index-core>=0.14.21",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-readers-docling>=0.4.2",
    "openai>=2.37.0",
    "pyarrow>=24.0.0",
    "pylance>=6.0.0",
    "pymupdf>=1.27.2.3",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "transformers>=5.8.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.mccabe]
max-complexity = 10
